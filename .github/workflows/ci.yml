name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "315532800"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and attest the pinned build toolchain
        run: python -m pip install --disable-pip-version-check --upgrade -r requirements-build.txt
      - name: Install hash-pinned test dependencies
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-test.lock
      - name: Verify exact build toolchain
        run: python -c "from importlib.metadata import version; expected={'pip':'25.2','setuptools':'80.9.0','wheel':'0.45.1'}; actual={name:version(name) for name in expected}; assert actual == expected, actual; print(actual)"
      - name: Build wheel and source distribution
        run: |
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
          python -c "from setuptools.build_meta import build_sdist; print(build_sdist('dist'))"
      - name: Verify exact candidate artifact cardinality
        run: python -c "from pathlib import Path; wheels=list(Path('dist').glob('*.whl')); sdists=list(Path('dist').glob('*.tar.gz')); assert len(wheels)==1, wheels; assert len(sdists)==1, sdists; print(wheels[0].name, sdists[0].name)"
      - name: Install the built wheel
        run: python -c "import glob,subprocess,sys; wheel=glob.glob('dist/*.whl'); assert len(wheel)==1, wheel; subprocess.check_call([sys.executable,'-m','pip','install','--no-deps','--force-reinstall',wheel[0]])"
      - name: Static/public boundary checks
        run: python scripts/check.py
      - name: Verify release publication remains disabled
        run: python scripts/check_release_policy.py
      - name: Unit tests against installed candidate
        run: python -m unittest discover -s tests -v
      - name: Complete behavior collection (unittest and pytest)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests
      - name: Verify canonical and legacy identities
        run: python -c "import importlib.metadata as m, rag_lab, rag_quality_bench; assert m.version('rag-quality-bench') == rag_lab.__version__ == rag_quality_bench.__version__ == '0.3.0'"
      - name: Validate synthetic suite
        run: rag-lab validate --suite examples/suite.json
      - name: Functional positive and counter-proof
        run: rag-lab probe --level functional
      - name: Legacy CLI compatibility
        run: rag-quality-bench probe --level functional
      - name: Exercise evidence paths
        run: |
          rag-lab demo --output reports/demo.json
          rag-lab index --suite examples/suite.json --strategy hybrid --output reports/index.json
          rag-lab verify-index --manifest reports/index.json
          rag-lab sweep --suite examples/suite.json --strategies overlap,bm25,hybrid --chunk-sizes 12,20 --overlaps 0,2 --output reports/sweep.json
          rag-lab export --report reports/demo.json --format markdown --output reports/demo.md
      - name: Smoke installed canonical CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          rag-lab probe --level liveness
          python -m rag_lab probe --level readiness
      - name: Verify and test complete source distribution
        run: python -c "import glob,subprocess,sys; archives=glob.glob('dist/*.tar.gz'); assert len(archives)==1, archives; subprocess.check_call([sys.executable,'scripts/verify_sdist.py',archives[0]])"
      - name: Generate prepared release evidence
        env:
          RAG_LAB_TESTS_VERIFIED: "1"
          RAG_LAB_COUNTERPROOF_VERIFIED: "1"
        run: python scripts/build_release_evidence.py --dist dist --output release-evidence
      - name: Verify prepared state is not publication
        run: python -c "import json; value=json.load(open('release-evidence/RELEASE_EVIDENCE.json')); assert value['state']=='PREPARED'; assert value['tests_verified'] is True; assert value['counterproof_verified'] is True; assert all(value[k] is False for k in ('signed','attested','tagged','published','released')); print(value['version'], value['state'])"
      - name: Upload candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            release-evidence/SHA256SUMS.txt
            release-evidence/rag-lab.cdx.json
            release-evidence/RELEASE_EVIDENCE.json
          if-no-files-found: error
          retention-days: 14

  attest-candidate:
    needs: [test]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner) || (github.event_name == 'pull_request' && github.actor == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download canonical Ubuntu/Python 3.11 candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-ubuntu-latest-py3.11
          path: /tmp/rag-lab-candidate-download
          digest-mismatch: error
      - name: Normalize and verify canonical candidate bundle
        run: |
          mkdir -p /tmp/rag-lab-candidate
          wheel="$(find /tmp/rag-lab-candidate-download -type f -name '*.whl' -print)"
          sdist="$(find /tmp/rag-lab-candidate-download -type f -name '*.tar.gz' -print)"
          sums="$(find /tmp/rag-lab-candidate-download -type f -name 'SHA256SUMS.txt' -print)"
          sbom="$(find /tmp/rag-lab-candidate-download -type f -name 'rag-lab.cdx.json' -print)"
          receipt="$(find /tmp/rag-lab-candidate-download -type f -name 'RELEASE_EVIDENCE.json' -print)"
          test "$(printf '%s\n' "$wheel" | grep -c .)" -eq 1
          test "$(printf '%s\n' "$sdist" | grep -c .)" -eq 1
          test "$(printf '%s\n' "$sums" | grep -c .)" -eq 1
          test "$(printf '%s\n' "$sbom" | grep -c .)" -eq 1
          test "$(printf '%s\n' "$receipt" | grep -c .)" -eq 1
          cp "$wheel" /tmp/rag-lab-candidate/
          cp "$sdist" /tmp/rag-lab-candidate/
          cp "$sums" /tmp/rag-lab-candidate/SHA256SUMS.txt
          cp "$sbom" /tmp/rag-lab-candidate/rag-lab.cdx.json
          cp "$receipt" /tmp/rag-lab-candidate/RELEASE_EVIDENCE.json
          test "$(find /tmp/rag-lab-candidate -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find /tmp/rag-lab-candidate -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          python -c "import json; p='/tmp/rag-lab-candidate/RELEASE_EVIDENCE.json'; v=json.load(open(p)); assert v['state']=='PREPARED' and v['published'] is False and v['released'] is False"
      - name: Generate signed SLSA provenance
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: /tmp/rag-lab-candidate/*.whl
      - name: Verify signed provenance policy
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          test -s "$BUNDLE_PATH"
          wheel="$(find /tmp/rag-lab-candidate -maxdepth 1 -name '*.whl' -print -quit)"
          gh attestation verify "$wheel" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$BUNDLE_PATH" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners >/dev/null
      - name: Write attestation receipt
        env:
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = {
              "schema_version": "1.0",
              "product": "RAG Lab",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_ref": os.environ["GITHUB_REF"],
              "source_digest": os.environ["GITHUB_SHA"],
              "runner_environment": os.environ.get("RUNNER_ENVIRONMENT"),
              "attestation_id": os.environ.get("ATTESTATION_ID"),
              "attestation_url": os.environ.get("ATTESTATION_URL"),
              "bundle_path": os.environ.get("BUNDLE_PATH"),
              "verified_with_gh_cli": True,
              "provenance": "sigstore-slsa-github-actions",
              "publication_authorized": False,
          }
          Path('/tmp/rag-lab-candidate/ATTESTATION-RECEIPT.json').write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Upload signed candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rag-lab-provenance-${{ github.run_id }}
          path: |
            ${{ steps.attest.outputs.bundle-path }}
            /tmp/rag-lab-candidate/*.whl
            /tmp/rag-lab-candidate/SHA256SUMS.txt
            /tmp/rag-lab-candidate/rag-lab.cdx.json
            /tmp/rag-lab-candidate/RELEASE_EVIDENCE.json
            /tmp/rag-lab-candidate/ATTESTATION-RECEIPT.json
          if-no-files-found: error
          retention-days: 30
